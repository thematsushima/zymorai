<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover your habit profile with a private, research-informed reflection on what helps habits stick.">
  <meta name="theme-color" content="#22c55e">
  <title>Habit Compass: Discover Your Habit Profile - Calcora</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .brand {
      display: inline;
      font-family: Arial, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand:first-letter {
      color: #111827;
    }

    .brand span {
      color: #22c55e;
    }

    :root {
      --green: #22c55e;
      --green-dark: #16a34a;
      --ink: #111827;
      --muted: #4b5563;
      --line: #e5e7eb;
      background: #f3f4f6;
      color: var(--ink);
    }

    header {
      max-width: none;
      background: #fff;
      border-bottom-color: var(--line);
      padding: 18px 24px;
    }

    footer {
      max-width: 720px;
      border-top-color: var(--line);
      padding: 24px 0;
    }

    main {
      max-width: 720px;
      margin: 50px auto;
    }

    .layout {
      display: block;
    }

    .sticky {
      position: static;
      margin-bottom: 28px;
    }

    .steps {
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    }

    .eyebrow, .pill, .link, summary, .sources a, a {
      color: var(--green-dark);
    }

    .notice {
      background: #f0fdf4;
      border-left-color: var(--green);
    }

    .card, fieldset {
      border-color: var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .06);
    }

    .choice:hover {
      border-color: var(--green);
      background: #f0fdf4;
    }

    .choice:has(input:checked) {
      border-color: var(--green);
      background: #f0fdf4;
      box-shadow: inset 0 0 0 1px var(--green);
    }

    input, progress {
      accent-color: var(--green);
    }

    button {
      background: var(--green);
    }

    button:hover {
      background: var(--green-dark);
      filter: none;
    }

    .secondary {
      background: #fff;
      color: var(--ink);
      border-color: #d1d5db;
    }

    .secondary:hover {
      background: #f9fafb;
    }

    .step.active {
      background: #f0fdf4;
      color: var(--green-dark);
    }

    .pill {
      background: #f0fdf4;
    }

    .plan {
      background: var(--green);
    }

    .plan .muted {
      color: #ecfdf5;
    }

    :focus-visible {
      outline-color: var(--green-dark);
    }
  </style>
  <style>
    .profile-subtitle { color: #16a34a; font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; }
    .profile-card { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr); gap: 28px; align-items: center; margin: 22px 0; padding: 24px; border: 1px solid #bbf7d0; border-radius: 16px; background: linear-gradient(135deg, #f0fdf4, #eff6ff); }
    .profile-card h2 { margin: 6px 0 0; font-size: 1.25rem; }
    .profile-card p { margin: 0; color: #4b5563; font-size: .9rem; }
    @media (max-width: 760px) { .profile-card { grid-template-columns: 1fr; gap: 14px; } }
  </style>
  <script type="module" src="app.js"></script>
  <script src="content-overrides.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to questions</a>
  <header>
    <a class="brand" href="/en/">calc<span>ora</span></a>
    <span class="tag">Habit Compass · A little clarity. Your next step.</span>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer>
    Made for reflection, not diagnosis. <button id="method" class="link">Method &amp; references</button>
  </footer>
  <dialog id="methodDialog" aria-labelledby="methodTitle">
    <button id="closeMethod" class="secondary close">Close</button>
    <div id="methodContent"></div>
  </dialog>
  <noscript>This questionnaire needs JavaScript enabled. Your responses are processed in your browser.</noscript>
</body>
</html>
